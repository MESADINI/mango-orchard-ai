services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mango_backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - OPEN_METEO_BASE_URL=${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./ml:/ml                       # ML package, model weights and recommendations DB
      - backend_data:/app/data         # SQLite database
      - backend_media:/app/media       # uploads and result overlays
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mango_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_media:
